<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0b">
  <meta name="robots" content="noindex">
  <title>Tu invitación — Caramelo</title>
  <link rel="stylesheet" href="/login.css">
  <script type="module" src="/login.js"></script>
</head>
<body>
  <main class="invitation">
    <p class="eyebrow">BUENOS AIRES / SOLO POR INVITACIÓN</p>
    <h1>CARAMELO</h1>
    <p class="intro">La contraseña te acerca a la puerta.<br>Del patova te encargás vos.</p>
    <form id="login-form">
      <label for="password">TU CONTRASEÑA</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required autofocus>
      <button type="submit">ESTOY EN LA LISTA ↗</button>
      <p id="login-error" role="alert" hidden></p>
    </form>
    <p class="note">Una noche. Seis intentos. Tu mejor chamuyo.</p>
    <p class="privacy">Beta para amigos · Los mensajes se envían a TypeSafe y OpenAI para jugar. No compartas datos sensibles.</p>
  </main>
</body>
</html>
